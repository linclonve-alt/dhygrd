<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Notional - Under Maintenance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 90%;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .badge {
            display: inline-block;
            background-color: #eef2ff;
            color: #4f46e5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">✈️</div>
        <h1>Flight Notional is under maintenance</h1>
        <p>We are currently performing scheduled updates to improve your experience. Please check back shortly.</p>
        <div class="badge">System Upgrade</div>
    </div>

</body>
</html>
